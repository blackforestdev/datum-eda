[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/engine-daemon",
    "crates/cli",
    "crates/test-harness",
    "crates/gui-protocol",
    "crates/gui-render",
    "crates/gui-app",
    "crates/gui-viewport",
    "crates/terminal-core",
    "crates/verb-registry",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Identity
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# Error handling
thiserror = "2"
anyhow = "1"
sha2 = "0.10"
quick-xml = "0.38"
ttf-parser = { version = "0.25", features = ["std"] }
lyon_path = "1"
lyon_tessellation = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Testing
proptest = "1"

# GUI spike
winit = "0.30"
wgpu = "28"
taffy = "0.11.0"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
arboard = "3"
libc = "0.2"

# Keep the canonical engine usable in the ordinary development application.
# Retain development arithmetic checks and assertions; no release-only behavior.
[profile.dev.package.eda-engine]
opt-level = 1
debug-assertions = true
overflow-checks = true

[profile.dev.package.serde_json]
opt-level = 1
debug-assertions = true
overflow-checks = true

[profile.dev.package.sha2]
opt-level = 1
debug-assertions = true
overflow-checks = true

[profile.dev.package.datum-gui-protocol]
opt-level = 1
debug-assertions = true
overflow-checks = true

[profile.dev.package.eda-engine-daemon]
opt-level = 1
debug-assertions = true
overflow-checks = true
