name: Alignment

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_qualification:
        description: Run exhaustive qualification for a designated major milestone
        required: true
        default: false
        type: boolean

jobs:
  alignment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Focused structural checks
        env:
          SOURCE_HEALTH_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: bash scripts/run_drift_gates.sh --focused

  qualification:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_qualification }}
    needs: alignment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        # rustup installs the toolchain and components from rust-toolchain.toml.
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Complete qualification is explicitly requested for a major milestone.
      # Routine changes use the focused job and affected checks during iteration.
      - name: Full drift gates (scripts/run_drift_gates.sh)
        env:
          # PRs compare against the protected base; pushes compare against the
          # prior branch tip. The checker fails closed if this revision is absent.
          SOURCE_HEALTH_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: bash scripts/run_drift_gates.sh --full

      - name: Workspace health audit
        run: python3 scripts/check_alignment.py --run-health

      - name: M3 preflight audit
        run: python3 scripts/check_alignment.py --run-m3-preflight

      - name: Route strategy evidence baseline gate
        run: python3 scripts/check_route_strategy_evidence.py

      - name: Native fixture validation gate
        run: python3 scripts/check_native_project_fixtures.py

      - name: Imported query determinism gate
        run: python3 scripts/check_import_query_determinism.py

  transport-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_qualification }}
    needs: qualification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Daemon socket transport smoke
        run: python3 scripts/run_cargo_guarded.py --workload proof -- cargo test -q -p eda-engine-daemon handle_client_round_trips_open_project_and_get_check_report -- --ignored
